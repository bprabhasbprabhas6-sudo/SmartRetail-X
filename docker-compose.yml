services:
  postgres:
    image: postgres:18
    container_name: smartretail-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    container_name: smartretail-api

    ports:
      - "8001:8001"

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:Prabhas%40123@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data: