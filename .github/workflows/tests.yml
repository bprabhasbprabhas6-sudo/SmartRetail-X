name: SmartRetail-X Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install pandas numpy scipy scikit-learn
          python -m pip install fastapi uvicorn pydantic python-dotenv
          python -m pip install sqlalchemy psycopg2-binary
          python -m pip install xgboost shap pyarrow
          python -m pip install pytest pytest-asyncio httpx
          python -m pip install ruff mypy

      - name: Create test fixtures
        run: python tests/fixtures/create_forecasting_fixture.py

      - name: Run Ruff
        run: ruff check app src tests

      - name: Run MyPy
        run: mypy app src --ignore-missing-imports

      - name: Run Pytest
        run: pytest -v
